[project]
name = "fdagent"
version = "0.1.0"
description = "Interruptible real-time voice agent: async intelligence, deterministic state (FDB-v3 / LiveKit)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
# Voice/benchmark deps are pinned in Phase 3 after they are installed and verified.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fdagent*"]
